# Daily stack X pull. Schedule is 06:30 Asia/Shanghai (22:30 UTC). No DST in that zone.
# The pull covers the past 7 Asia/Shanghai calendar days (XIAOMI_PULL_WINDOW_DAYS, default 7).
# The job applies pending migrations, pulls and ingests, then checks Asia/Shanghai
# today has daily_aggregates in Postgres. A failed step stops the job.
# Fixture batches are not part of this job. Xiaomi credentials stay in Actions, not on Render.
name: daily-live-pull

on:
  schedule:
    - cron: "30 22 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: marco-health-daily-live-pull
  cancel-in-progress: false

jobs:
  pull-and-ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install
        run: npm ci

      - name: Apply schema
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npm run migrate

      - name: Pull the past 7 Shanghai days and ingest
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          XIAOMI_USER_ID: ${{ secrets.XIAOMI_USER_ID }}
          XIAOMI_PASS_TOKEN: ${{ secrets.XIAOMI_PASS_TOKEN }}
          XIAOMI_DEVICE_ID: ${{ secrets.XIAOMI_DEVICE_ID }}
          XIAOMI_PULL_WINDOW_DAYS: "7"
        run: npm run pull:live

      - name: Verify Shanghai today in Postgres
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npm run verify:live
